<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframe</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            width: 100px;
            height: 100px;
            background-color: peru;
            color: purple;
            text-align: center;
            position: relative;
            animation: animacao 5s infinite;
        }

        @keyframes animacao {
            0% {
                color: purple;
            
            }

            50% {
                color: greenyellow;
                transform: rotate(180deg);
                transform-origin: left top;
            }

            100% {
                color: purple;
                transform: rotate(360deg)
                transform-origin: right bottom;
            }

        }
    </style>
</head>

<body>
    <h1>
        olar
    </h1>
</body>

</html>
